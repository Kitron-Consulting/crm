name: CI

# Fast feedback on every push and PR: lint + the test suite (no binary build —
# that's the tag-triggered Release workflow). Release also re-runs these as a
# gate, so a tag pushed to an untested commit still can't ship red.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - name: Check for undefined names
        run: ruff check --select F821 crm

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bracket the supported range (pyproject requires-python >= 3.10).
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q
